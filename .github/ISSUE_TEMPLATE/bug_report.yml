name: Bug Report
description: Report a reproducible problem or unexpected behavior in RouteLens.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please check existing issues before submitting.
  - type: input
    id: version
    attributes:
      label: RouteLens Version
      description: What version of RouteLens are you running? (e.g., `v2.3.0` or git commit)
      placeholder: v2.3.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System / Architecture
      options:
        - Linux (x86_64)
        - Linux (arm64)
        - macOS (Apple Silicon - M1/M2/M3/M4)
        - macOS (Intel)
        - Windows (x86_64)
        - Docker
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the problem.
      placeholder: |
        1. Run `routelens --config ...`
        2. Open dashboard at `http://localhost:8080`
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Output
      description: Relevant logs or terminal output (please sanitize sensitive IP addresses or tokens).
      render: shell
